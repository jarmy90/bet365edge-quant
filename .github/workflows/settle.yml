# =============================================================================
# LIQUIDACION DE RESULTADOS (2 veces al dia) - track record publico
# -----------------------------------------------------------------------------
# QUE RESUELVE
#   El historial de liquidacion (aciertos/fallos y unidades ganadas) se guarda en
#   edge-futbol/data/track-record.json. Con cada pick publicado se anota el
#   pronostico; cuando el partido ya tiene marcador (fuente football-data.org)
#   se liquida contra la linea apostada y se actualiza el fichero.
#   Este workflow corre esa liquidacion 2 veces al dia y, SOLO si el JSON ha
#   cambiado, lo commitea y lo publica (la web lo lee desde el repo).
#
# CADENCIA
#   06:00 y 18:00 UTC (cron '0 6,18 * * *'), 2 ciclos diarios.
#   Tambien se puede lanzar a mano: Actions > Liquidar resultados > Run workflow.
#
# SECRETOS
#   FOOTBALL_DATA_API_KEY -> clave gratuita de api.football-data.org/v4
#                            (Settings > Secrets and variables > Actions).
#                            Sin ella se usa el tier anonimo, mas lento/limitado.
#   Permiso del job: 'contents: write' (necesario para el push del track record).
#
# SIN COMMITS VACIOS
#   Si la liquidacion no cambia nada, `git diff --cached --quiet` detecta que no
#   hay nada que publicar y el job termina en verde sin commit ni push.
# =============================================================================
name: Liquidar resultados

on:
  schedule:
    # UTC: 06:00 y 18:00 -> dos ciclos diarios de liquidacion.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Un solo ciclo a la vez: la liquidacion toca el mismo fichero.
concurrency:
  group: settle-track-record
  cancel-in-progress: false

permissions:
  contents: write          # necesario para commit+push del track record

jobs:
  liquidar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      # Por defecto el script usa edge-futbol/data/track-record.json; se declara
      # explicito para que el workflow y el fichero no puedan desalinearse.
      TRACK_FILE: edge-futbol/data/track-record.json

    steps:
      # ----------------------------------------------------------------------
      # 1) Codigo completo (hace falta la rama para poder hacer push despues)
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ----------------------------------------------------------------------
      # 2) Liquidar: consulta los marcadores (football-data.org) y actualiza
      #    el historial. Sin argumentos: se configura solo por variables de
      #    entorno (FD_KEY / FOOTBALL_DATA_API_KEY, TRACK_FILE, API_BASE).
      #    No tiene dependencias npm: solo modulos internos de Node.
      # ----------------------------------------------------------------------
      - name: Liquidar resultados pendientes
        run: node edge-futbol/settle_results.js

      # ----------------------------------------------------------------------
      # 3) Publicar SOLO si el track record ha cambiado
      # ----------------------------------------------------------------------
      - name: Commit + push del track record
        run: |
          set -uo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add edge-futbol/data/track-record.json

          # Nada que publicar: sin commit vacio y sin push.
          if git diff --cached --quiet; then
            echo "El track record no ha cambiado: nada que publicar."
            exit 0
          fi

          git commit -m "chore: liquida resultados"
          git push
